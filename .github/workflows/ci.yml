# Integracion continua (Trunk Based Development): cada push a main y cada pull
# request ejecutan las pruebas automatizadas y construyen la imagen Docker.
# Si algo falla, el cambio no se integra al tronco.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas automatizadas (H2 en modo Oracle)
        run: chmod +x mvnw && ./mvnw -B test
      - name: Construccion de la imagen Docker
        run: docker build -t microservicio:ci .
