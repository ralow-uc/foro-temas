# ---------------------------------------------------------------------------
# Perfil "oracle": esquema FORO en Oracle Autonomous Database
# (ADB FULLSTACK-3, region Chile Central / Santiago).
#
# Las credenciales NO se escriben aqui: se leen de variables de entorno para que
# nunca lleguen al repositorio. La forma comoda de arrancar los dos servicios es:
#
#     ./scripts/run-todo.sh
#
# ese script arma la URL, toma la contrasena del Llavero de macOS y lanza el
# perfil "oracle" en ambos microservicios.
#
# CUIDADO con la ruta del Wallet: no puede contener espacios. El driver JDBC de
# Oracle los elimina al parsear el parametro TNS_ADMIN de la URL y la conexion
# falla con ORA-12263. Por eso el Wallet vive en ~/.oracle/wallets/FULLSTACK3 y
# no junto al proyecto, cuya ruta tiene espacios.
# ---------------------------------------------------------------------------

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Las tablas y secuencias se crean con scripts/01_crear_tablas.sql.
# "validate" comprueba que el mapeo JPA coincida con las tablas reales y no
# modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Las tablas del foro viven en el esquema FORO.
spring.jpa.properties.hibernate.default_schema=FORO
