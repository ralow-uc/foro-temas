# ---------------------------------------------------------------------------
# Perfil "local": H2 en memoria, en modo Oracle.
# Permite levantar el microservicio y probar todo en Postman sin depender de la
# red ni de las credenciales de Oracle. No es la base de la entrega.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:foro_temas;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 crea las tablas y secuencias a partir de las entidades JPA.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
