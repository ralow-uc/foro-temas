# ---------------------------------------------------------------------------
# Microservicio foro-temas
#
# Perfiles disponibles:
#   local   -> base de datos H2 en memoria, para desarrollar sin credenciales.
#   oracle  -> esquema FORO en Oracle Autonomous Database.
#
# El perfil se elige con la variable SPRING_PROFILES_ACTIVE o con:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=oracle
# ---------------------------------------------------------------------------

spring.application.name=foro-temas
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=8082

# Las respuestas de error incluyen el mensaje para facilitar la revision en Postman.
server.error.include-message=always

# Formato legible del JSON devuelto por el controlador REST.
spring.jackson.serialization.indent-output=true

# Secreto compartido con el que foro-usuarios firma el JWT y foro-temas lo valida.
# En local y en las pruebas se usa el valor por defecto; contra Oracle se exporta
# la variable de entorno FORO_JWT_SECRETO (ver scripts/run-todo.sh).
foro.jwt.secreto=${FORO_JWT_SECRETO:clave-de-desarrollo-del-foro-de-cubos-no-usar-en-produccion}
foro.jwt.minutos-de-vigencia=120

# Niveles de log: INFO global y DEBUG en el codigo propio, como indica la guia.
logging.level.root=INFO
logging.level.com.foro.temas=DEBUG

# Monitoreo del microservicio
management.endpoints.web.exposure.include=health,info
